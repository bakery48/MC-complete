<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Mr.Children 歌唱トラッカー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="header-title">
      <span class="header-logo">🎤</span>
      <div>
        <h1>Mr.Children</h1>
        <p class="header-sub">歌唱トラッカー</p>
      </div>
    </div>
    <button class="sync-status-btn" id="btn-sync-settings" title="同期設定">
      <span class="sync-dot" id="sync-dot"></span>
    </button>
    <div class="header-progress">
      <span id="strong-count" class="strong-count-badge"></span>
      <span id="progress-text">0 / 0</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>
  </header>

  <!-- タブナビ -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="album">アルバム別</button>
    <button class="tab-btn" data-tab="kana">五十音順</button>
    <button class="tab-btn" data-tab="ranking">ランキング</button>
    <button class="sung-filter-btn" id="btn-sung-filter">済を隠す</button>
  </nav>

  <!-- コンテンツエリア -->
  <main class="content">

    <!-- アルバム別ビュー -->
    <section id="view-album" class="view active">
      <div id="album-list"></div>
    </section>

    <!-- ランキングビュー -->
    <section id="view-ranking" class="view">
      <div class="ranking-sort">
        <button class="ranking-sort-btn active" data-sort="rate">消化率が高い順</button>
        <button class="ranking-sort-btn" data-sort="remaining">未消化曲が多い順</button>
      </div>
      <div id="ranking-list"></div>
    </section>

    <!-- 五十音順ビュー -->
    <section id="view-kana" class="view">
      <!-- 行ジャンプナビ -->
      <div class="kana-jump-nav" id="kana-jump-nav"></div>
      <div id="kana-list"></div>
    </section>

  </main>

  <!-- フッター（エクスポート・インポート） -->
  <footer class="app-footer">
    <button class="footer-btn accent" id="btn-random">ランダム</button>
    <button class="footer-btn" id="btn-export">エクスポート</button>
    <button class="footer-btn" id="btn-import">インポート</button>
    <button class="footer-btn danger" id="btn-reset">リセット</button>
    <input type="file" id="import-file-input" accept=".json" style="display:none" />
  </footer>

  <!-- モーダル（インポート確認） -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal">
      <p id="modal-message"></p>
      <div class="modal-btns">
        <button class="modal-btn" id="modal-cancel">キャンセル</button>
        <button class="modal-btn primary" id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <!-- 同期設定モーダル -->
  <div class="modal-overlay" id="sync-modal" hidden>
    <div class="modal">
      <p class="sync-modal-title">同期設定</p>
      <p class="sync-modal-desc">Firebase Realtime Database を使って複数デバイスでリアルタイム同期します。Firebase コンソールでプロジェクトを作成し、Realtime Database をテストモードで開始してください。</p>
      <div class="sync-field">
        <span>データベース URL</span>
        <input type="url" id="sync-url" placeholder="https://xxx-default-rtdb.firebaseio.com" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="sync-field">
        <span>ルーム名（グループを分ける場合）</span>
        <input type="text" id="sync-room" placeholder="default" autocomplete="off">
      </div>
      <div class="modal-btns">
        <button class="modal-btn" id="sync-modal-close">閉じる</button>
        <button class="modal-btn danger" id="sync-modal-disconnect">切断</button>
        <button class="modal-btn primary" id="sync-modal-connect">接続</button>
      </div>
    </div>
  </div>

  <script src="albums.js"></script>
  <script src="yomi.js"></script>
  <script src="app.js"></script>
</body>
</html>
